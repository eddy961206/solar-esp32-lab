name: UI checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser and interaction checks
        run: |
          mkdir -p /tmp/solar-ui
          npm start > /tmp/solar-ui/server.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node scripts/ui-checks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-ui-${{ github.sha }}
          path: /tmp/solar-ui
          retention-days: 7
